<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Trip · Meydan Okuma</title>
<meta property="og:title" content="Sana meydan okundu! · Word Trip">
<meta property="og:description" content="Arkadaşın bir bulmacayı çözdü. Onu geçebilir misin?">
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #2a1f4d; color: #fff; text-align: center; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 20px; }
  img { width: 110px; border-radius: 26px; }
  h1 { font-size: 32px; margin: 20px 0 6px; }
  p { color: #ddd6f3; line-height: 1.5; }
  .code { font-family: monospace; font-size: 20px; background: rgba(255,255,255,.1); padding: 10px 14px; border-radius: 10px; display: inline-block; }
  a.btn { display: block; margin: 16px auto 0; max-width: 320px; padding: 16px; border-radius: 14px; color: #fff; text-decoration: none; font-weight: 700; }
  .go { background: #38b761; } .get { background: #6b4fd8; }
</style>
</head>
<body>
<main>
  <img src="simge.png" alt="">
  <h1>Sana meydan okundu!</h1>
  <p id="info">Arkadaşın bir bulmacayı çözdü. Onu geçebilir misin?</p>
  <div class="code" id="code"></div>
  <a class="btn go" id="open" href="#">Oyunda aç</a>
  <a class="btn get" href="https://play.google.com/store/apps/details?id=com.kelimeturu.game">Oyunu indir</a>
  <p style="font-size:14px">Oyun açılmazsa kodu kopyalayıp oyunu aç; meydan okuma kendiliğinden başlar.</p>
</main>
<script>
  // Bağlantı: .../meydan.html?k=KT-123-84-...  -> oyunu açar (Android'de intent ile), yoksa Play'e gider
  var k = (new URLSearchParams(location.search).get("k") || "").replace(/[^A-Za-z0-9-]/g, "");
  var m = /^KT-(\d{1,4})-(\d{1,6})/.exec(k);
  document.getElementById("code").textContent = k || "";
  if (m) {
    var s = +m[2];
    document.getElementById("info").textContent = "Arkadaşın bu bulmacayı " + Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2) + " sürede çözdü. Onu geçebilir misin?";
  }
  var play = "https://play.google.com/store/apps/details?id=com.kelimeturu.game";
  var intent = "intent://meydan/" + k + "#Intent;scheme=kelimeturu;package=com.kelimeturu.game;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
  var open = document.getElementById("open");
  open.href = /Android/i.test(navigator.userAgent) ? intent : play;
  open.addEventListener("click", function () { try { navigator.clipboard.writeText(k); } catch (e) {} });
  if (k && /Android/i.test(navigator.userAgent)) setTimeout(function () { location.href = intent; }, 400);
</script>
</body>
</html>
